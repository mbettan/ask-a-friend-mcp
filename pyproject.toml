[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ask-a-friend-mcp"
version = "1.0.0"
description = "Cloud-hosted MCP server for AI peer review — ask Claude Opus 5.5 (opus-5-5) & Gemini 3.8 Flash (High Thinking) for scoped second opinions via Vertex AI."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12, <3.15"
dependencies = [
    "mcp>=1.9.0,<2.0.0",
    "starlette>=0.38.0",
    "uvicorn[standard]>=0.30.0",
    "google-auth>=2.29.0",
    "google-genai>=1.0.0",
    "anthropic[vertex]>=0.42.0",
    "requests>=2.31.0",
    "urllib3>=2.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
]

authors = [
    { name = "Ask-a-Friend MCP Contributors" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "ai-peer-review",
    "claude",
    "gemini",
    "vertex-ai",
    "chatgpt",
    "cursor",
    "code-review",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://mbettan.github.io/ask-a-friend-mcp/"
Repository = "https://github.com/mbettan/ask-a-friend-mcp"
Issues = "https://github.com/mbettan/ask-a-friend-mcp/issues"

[project.scripts]
ask-friend = "src.server:run_server"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
